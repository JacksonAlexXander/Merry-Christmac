<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星光圣诞树 · Merry Christmas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100svh; min-width: 260px; color: #f6e8cb;
    background: #060d0f;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main {
    min-height: 100svh; padding: clamp(22px, 4.5vw, 70px);
    display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    position: relative; isolation: isolate; overflow: hidden;
    background: radial-gradient(ellipse at 71% 51%, #122e25 0%, #0a1a1a 30%, #070f13 54%, #060b0e 87%);
  }
  main::before {
    content: ""; position: absolute; inset: clamp(10px, 2vw, 28px);
    border: 1px solid #c7a46a35; pointer-events: none; z-index: 2;
  }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .greeting {
    align-self: center; padding: 12px 0 18px clamp(0px, 3.5vw, 56px);
    z-index: 1;
  }
  .motif {
    display: flex; align-items: center; gap: 13px; width: 112px; margin: 0 0 30px;
    color: #e3ba70; font: 20px Georgia, serif;
  }
  .motif::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, #bd9958aa, transparent); }
  h1 {
    margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400;
    font-size: clamp(46px, 6.7vw, 112px); line-height: .94; letter-spacing: -.064em;
    text-shadow: 0 2px 32px #ecb97421;
  }
  h1 span { display: block; }
  h1 em { font-weight: 400; color: #edc37d; }
  .wish { color: #e2d4b9; margin: 28px 0 0; font-size: 14px; letter-spacing: .24em; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 38px; }
  button {
    font: inherit; font-size: 13px; color: #f3e3c4; padding: 8px 14px; min-height: 40px;
    border: 1px solid #b5955b68; border-radius: 4px;
    background: #0b1819; cursor: pointer;
  }
  button:hover { background: #24332b; border-color: #e6bd7b; }
  #camera {
    color: #20170e; background: #edc37d; border-color: #edc37d; font-weight: 650;
  }
  #camera:hover { background: #ffda98; }
  :is(button, input, a, #tree):focus-visible { outline: 2px solid #f2c97e; outline-offset: 4px; }
  .zoom {
    display: flex; align-items: center; gap: 11px; margin-top: 18px;
    color: #e2d4b9; font-size: 12px; width: min(100%, 260px);
  }
  .zoom input { flex: 1; min-width: 0; margin: 0; accent-color: #edc37d; cursor: pointer; }
  #zoom-value { font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  .gesture { margin-top: 15px; width: min(100%, 335px); }
  .gesture p { margin: 0; color: #c1c2ae; font-size: 12px; line-height: 1.7; }
  .gesture a { color: #edc37d; font-size: 12px; }
  .preview {
    position: relative; float: left; width: 106px; margin: 1px 13px 0 0;
    background: #101c1e; border: 1px solid #b5955b68; border-radius: 5px; overflow: hidden;
  }
  .preview video { width: 100%; display: block; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview :is(video, canvas) { transform: scaleX(-1); }
  .gesture::after { content: ""; display: block; clear: both; }
  .tree-stage {
    align-self: center; width: 100%; height: min(83svh, 850px); min-height: 380px;
    position: relative; min-width: 0; overflow: clip; isolation: isolate;
  }
  #tree {
    width: 100%; height: 100%; position: relative; z-index: 2;
    cursor: grab; touch-action: pan-y; display: block;
  }
  #tree:active { cursor: grabbing; }
  .gifts { position: absolute; inset: 0; pointer-events: none; }
  .gift {
    position: absolute; top: 0; left: 0; min-height: 0; padding: 1px; pointer-events: auto;
    border: 1px solid #d7ac65; border-radius: 2px; background: #835732;
    box-shadow: 0 2px 6px #050c0bd9, 0 0 7px #e5ac5b3b;
    transform-origin: 50% 0; width: var(--gift-width); aspect-ratio: .86;
  }
  .gift img {
    width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 42%;
    border-radius: 1px; filter: saturate(.78) brightness(.85);
  }
  .gift::before {
    content: ""; position: absolute; bottom: 100%; left: 50%; width: 1px;
    height: calc(var(--gift-width) * .5); background: linear-gradient(transparent, #d7ac65);
  }
  .gift::after {
    content: ""; position: absolute; bottom: calc(100% - 2px); left: 50%;
    width: max(7px, calc(var(--gift-width) * .37)); height: max(3px, calc(var(--gift-width) * .17));
    transform: translateX(-50%) rotate(-7deg); border-radius: 55% 20%;
    background: linear-gradient(95deg, #c08d43, #ffe3a8 48%, #c08d43 60%, #f8cb80);
  }
  .gift:is(:hover, :focus-visible) {
    border-color: #ffe7ad; box-shadow: 0 0 11px #ffcc6e82;
  }
  .gift:is(:hover, :focus-visible) img { filter: none; }
  #open-album { border-color: #d9b77d91; }
  #memory-dialog {
    width: min(880px, calc(100vw - 28px)); max-height: min(87svh, 850px);
    padding: 0; background: #0b191a; color: #f6e8cb;
    border: 1px solid #cba66882; border-radius: 10px;
    box-shadow: 0 28px 96px #000b;
  }
  #memory-dialog::backdrop { background: #030809d9; backdrop-filter: blur(6px); }
  .album-body { padding: clamp(16px, 4vw, 35px); }
  .album-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .album-header h2 {
    margin: 0; color: #f1c983; font: 400 clamp(22px, 5vw, 32px) Georgia, "Songti SC", SimSun, serif;
    letter-spacing: .09em;
  }
  .album-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
  .album-card { aspect-ratio: .88; padding: 3px; background: #79603e; min-height: 0; }
  .album-card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; border-radius: 1px; }
  .memory-image {
    display: block; width: 100%; height: min(57svh, 555px);
    object-fit: contain; background: #060e10; border-radius: 4px; touch-action: pan-y;
  }
  .album-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .album-nav span { color: #e2d4b9; font-size: 13px; font-variant-numeric: tabular-nums; }
  .album-steps { display: flex; gap: 6px; }
  #album-gesture { color: #c1c2ae; margin: 14px 0 0; font-size: 12px; text-align: center; }
  @media (max-width: 540px) {
    .album-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .album-nav button { padding: 7px 9px; }
  }
  .hint {
    grid-column: 2; justify-self: center; align-self: end; position: absolute;
    bottom: clamp(19px, 3.8vw, 51px); margin: 0; z-index: 1;
    color: #c1c2ae; font-size: 11px; letter-spacing: .14em; pointer-events: none;
  }
  noscript p { position: absolute; bottom: 20px; left: 25px; z-index: 2; }
  @media (max-width: 700px) {
    main {
      grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr);
      padding: 28px 16px 39px;
      background: radial-gradient(ellipse at 50% 58%, #122e25, #0a181a 36%, #060b0e 76%);
    }
    .greeting { text-align: center; padding: 0 0 5px; }
    .motif { justify-content: center; margin: 0 auto 7px; width: auto; font-size: 16px; }
    .motif::after { display: none; }
    h1 { font-size: clamp(29px, 9vw, 64px); }
    h1 span { display: inline; }
    .wish { margin-top: 13px; font-size: 11px; }
    .controls { justify-content: center; margin-top: 14px; }
    button { min-height: 38px; }
    .zoom { margin: 13px auto 0; }
    .gesture { margin: 10px auto 0; }
    .preview { float: none; margin: 0 auto 5px; width: 88px; }
    .tree-stage { height: 100%; min-height: 285px; }
    .hint { grid-column: 1; bottom: 17px; }
  }
</style>
</head>
<body>
<main>
  <canvas id="sky" aria-hidden="true"></canvas>
  <section class="greeting" aria-label="圣诞贺卡">
    <div class="motif" aria-hidden="true">✦</div>
    <h1 lang="en"><span>Merry</span> <em>Christmas</em></h1>
    <p class="wish">愿你有个温暖的圣诞节</p>
    <div class="controls">
      <button id="camera" type="button" aria-describedby="camera-help">开启手势</button>
      <button id="play" type="button">暂停动画</button>
      <button id="open-album" type="button" hidden>回忆相册</button>
      <button id="soundtrack-toggle" type="button" hidden>开启音乐</button>
    </div>
    <div class="zoom">
      <label for="zoom">缩放</label>
      <input id="zoom" type="range" min="70" max="180" value="100">
      <span id="zoom-value" aria-hidden="true">100%</span>
    </div>
    <div class="gesture">
      <div class="preview" id="preview" hidden>
        <video id="camera-video" autoplay muted playsinline aria-hidden="true"></video>
        <canvas id="camera-overlay" aria-hidden="true"></canvas>
      </div>
      <p id="camera-help">张开拇指和食指放大，捏近缩小。</p>
      <p id="camera-status" role="status"></p>
      <a id="online-card" href="https://jacksonalexxander.github.io/Merry-Christmac/" hidden>打开支持摄像头的在线版</a>
    </div>
  </section>
  <div class="tree-stage">
    <canvas id="tree" tabindex="0" aria-label="闪烁的三维圣诞树，使用左右方向键旋转"
            aria-describedby="hint">这是一棵点缀彩灯和金色星星的圣诞树。</canvas>
    <div class="gifts" id="gifts" role="group" aria-label="树上的照片礼物" hidden></div>
  </div>
  <p id="hint" class="hint">拖动或按 ← / → 旋转</p>
  <noscript><p>请在浏览器中启用 JavaScript，查看圣诞树动画。</p></noscript>
</main>
<dialog id="memory-dialog" aria-labelledby="album-title">
  <section class="album-body">
    <header class="album-header">
      <h2 id="album-title">我们的故事</h2>
      <form method="dialog"><button id="close-album" type="submit">关闭</button></form>
    </header>
    <div id="album-grid" class="album-grid"></div>
    <div id="memory-detail" hidden>
      <img id="memory-image" class="memory-image" draggable="false" alt="">
      <div class="album-nav">
        <button id="album-overview" type="button">全部照片</button>
        <span id="memory-number" role="status"></span>
        <div class="album-steps">
          <button id="previous-memory" type="button">上一张</button>
          <button id="next-memory" type="button">下一张</button>
        </div>
      </div>
    </div>
    <p id="album-gesture" hidden>向左挥手看下一张，向右挥手看上一张。</p>
  </section>
</dialog>

<script>
"use strict";
const {tree, snow} = JSON.parse(document.querySelector("#scene").textContent);
const memories = JSON.parse(document.querySelector("#memories").textContent);
const treeCanvas = document.querySelector("#tree");
const skyCanvas = document.querySelector("#sky");
const play = document.querySelector("#play");
const zoomControl = document.querySelector("#zoom");
const zoomValue = document.querySelector("#zoom-value");
const soundtrackPlayer = document.querySelector("#soundtrack-player");
const soundtrackToggle = document.querySelector("#soundtrack-toggle");
if (soundtrackPlayer.hasAttribute("src")) {
  soundtrackToggle.hidden = false;
  soundtrackPlayer.volume = .4;
  const start = () => soundtrackPlayer.play().catch(() => {});
  const onFirstClick = (event) => {
    if (event.isTrusted && !soundtrackToggle.contains(event.target)) start();
  };
  document.addEventListener("click", onFirstClick, true);
  soundtrackPlayer.addEventListener("playing", () => {
    soundtrackToggle.textContent = "暂停音乐";
    document.removeEventListener("click", onFirstClick, true);
  });
  soundtrackPlayer.addEventListener("pause", () => {
    soundtrackToggle.textContent = "开启音乐";
  });
  soundtrackPlayer.addEventListener("error", () => {
    soundtrackToggle.textContent = "音乐暂不可用";
    soundtrackToggle.disabled = true;
    document.removeEventListener("click", onFirstClick, true);
  });
  soundtrackToggle.addEventListener("click", () => {
    document.removeEventListener("click", onFirstClick, true);
    if (soundtrackPlayer.paused) start();
    else soundtrackPlayer.pause();
  });
  start();
}
const ctx = treeCanvas.getContext("2d");
const sky = skyCanvas.getContext("2d");
const giftLayer = document.querySelector("#gifts");
const albumButton = document.querySelector("#open-album");
const album = document.querySelector("#memory-dialog");
const albumGrid = document.querySelector("#album-grid");
const detail = document.querySelector("#memory-detail");
const detailImage = document.querySelector("#memory-image");
const memoryNumber = document.querySelector("#memory-number");
const overviewButton = document.querySelector("#album-overview");
let selectedMemory = 0;
let albumArmed = true;
let touchStart = null;

function showMemory(index) {
  selectedMemory = (index + memories.length) % memories.length;
  const label = "第 " + (selectedMemory + 1) + " 张照片";
  detailImage.alt = label;
  detailImage.src = memories[selectedMemory].photo;
  memoryNumber.textContent = (selectedMemory + 1) + " / " + memories.length;
  albumGrid.hidden = true;
  detail.hidden = false;
}

function openMemory(index) {
  const wasClosed = !album.open;
  showMemory(index);
  if (wasClosed) album.showModal();
  overviewButton.focus();
}

function stepMemory(direction) {
  if (detail.hidden) openMemory(selectedMemory + direction);
  else showMemory(selectedMemory + direction);
}

function showOverview(focusIndex) {
  detail.hidden = true;
  albumGrid.hidden = false;
  if (!album.open) album.showModal();
  albumGrid.children[focusIndex]?.focus();
}

function photoButton(index, className) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = className;
  button.setAttribute("aria-label", "打开第 " + (index + 1) + " 张照片");
  const image = new Image();
  image.alt = "";
  image.decoding = "async";
  image.src = memories[index].thumb;
  button.append(image);
  button.addEventListener("click", () => openMemory(index));
  return button;
}

// Keep each gift at a fixed point on a ring in the tree's 3D space.
const branchRadii = [0.38, 0.46, 0.57, 0.70, 0.84];
const ornaments = [];
for (let row = 0, index = 0; row < branchRadii.length; row++) {
  const count = row + 3;
  for (let column = 0; column < count && index < memories.length; column++, index++) {
    const phi = column * (2 * Math.PI / count) + row * .63 + .24;
    const radius = branchRadii[row];
    const button = photoButton(index, "gift");
    ornaments.push({
      button, radius, index,
      x: Math.cos(phi) * radius,
      z: Math.sin(phi) * radius,
      y: 1.27 - row * .282 + Math.sin(index * 2.4) * .049
    });
    giftLayer.append(button);
    albumGrid.append(photoButton(index, "album-card"));
  }
}
if (memories.length) {
  giftLayer.hidden = false;
  albumButton.hidden = false;
  document.querySelector("#camera-help").textContent = "张开拇指和食指放大，捏近缩小。放大到顶打开相册。";
  document.querySelector("#hint").textContent = "拖动旋转 · 点礼物打开照片";
  albumButton.addEventListener("click", () => showOverview(0));
  overviewButton.addEventListener("click", () => showOverview(selectedMemory));
  document.querySelector("#previous-memory").addEventListener("click", () => stepMemory(-1));
  document.querySelector("#next-memory").addEventListener("click", () => stepMemory(1));
  album.addEventListener("keydown", (event) => {
    if (detail.hidden || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
    event.preventDefault();
    stepMemory(event.key === "ArrowLeft" ? -1 : 1);
  });
  album.addEventListener("click", (event) => {
    if (event.target === album) album.close();
  });
  detailImage.addEventListener("pointerdown", (event) => {
    if (event.isPrimary && event.pointerType === "touch") {
      touchStart = {x: event.clientX, y: event.clientY};
    }
  });
  detailImage.addEventListener("pointerup", (event) => {
    if (!touchStart || !event.isPrimary) return;
    const dx = event.clientX - touchStart.x;
    const dy = event.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.6) stepMemory(dx < 0 ? 1 : -1);
  });
  detailImage.addEventListener("pointercancel", () => { touchStart = null; });
  album.addEventListener("close", () => { touchStart = null; });
}
const PALETTE = [
  ["#2c9671", "#94ebbb"], ["#765041", "#d69b63"], ["#e4a64e", "#fff2af"],
  ["#d36c66", "#ffd5b8"], ["#e7a44e", "#fff0ae"], ["#83ceda", "#ddfaff"]
];

function makeLight(inner, outer, glow) {
  const sprite = document.createElement("canvas");
  sprite.width = sprite.height = 64;
  const paint = sprite.getContext("2d");
  const gradient = paint.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, inner);
  gradient.addColorStop(glow ? 0.26 : 0.40, outer);
  gradient.addColorStop(0.64, outer + (glow ? "37" : "16"));
  gradient.addColorStop(1, outer + "00");
  paint.fillStyle = gradient;
  paint.fillRect(0, 0, 64, 64);
  return sprite;
}

const lights = PALETTE.map(([outer, inner], i) => makeLight(inner, outer, i >= 2));
const snowLight = makeLight("#f5eed8", "#a5b7af", false);
const starLight = makeLight("#fff4b2", "#d89942", true);
const projected = tree.map(() => ({}));
const motion = matchMedia("(prefers-reduced-motion: reduce)");
let playing = !motion.matches;
let angle = 0.32;
let elapsed = 0;
let previous = 0;
let frame = 0;
let pointer = null;
let treeZoom = 1;
let width, height, skyWidth, skyHeight;

function fitCanvas(canvas, context) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const ratio = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  return [width, height];
}

function drawSnow() {
  sky.clearRect(0, 0, skyWidth, skyHeight);
  for (const [x, y, size, speed, phase] of snow) {
    const drift = 0.021 * Math.sin(elapsed * 0.35 + phase * 18) + 0.008 * elapsed;
    const left = ((x + drift + 1) % 1) * skyWidth;
    const top = ((y + elapsed * (0.013 + speed * 0.023)) % 1) * skyHeight;
    const radius = 0.55 + size ** 4 * 3.25;
    sky.globalAlpha = 0.21 + 0.48 * phase;
    sky.drawImage(snowLight, left - radius, top - radius, radius * 2, radius * 2);
  }
  sky.globalAlpha = 1;
}

function drawStar(x, y, radius) {
  const halo = radius * (2.6 + 0.23 * Math.sin(elapsed * 2.2));
  ctx.globalAlpha = 0.32;
  ctx.drawImage(starLight, x - halo, y - halo, halo * 2, halo * 2);
  ctx.globalAlpha = 1;
  const corners = Array.from({length: 10}, (_, index) => {
    const phi = index * Math.PI / 5 - Math.PI / 2;
    const distance = radius * (index % 2 ? 0.42 : 1);
    return [x + Math.cos(phi) * distance, y + Math.sin(phi) * distance];
  });
  const gold = ctx.createLinearGradient(x, y - radius, x, y + radius);
  gold.addColorStop(0, "#fff5cb");
  gold.addColorStop(0.48, "#ffda83");
  gold.addColorStop(1, "#d8944a");
  ctx.beginPath();
  corners.forEach(([px, py], index) => index ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
  ctx.closePath();
  ctx.fillStyle = gold;
  ctx.fill();
  ctx.fillStyle = "#fff8d9a8";
  for (let index = 0; index < corners.length; index += 2) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(...corners[index]);
    ctx.lineTo(...corners[index + 1]);
    ctx.closePath();
    ctx.fill();
  }
}

function placeGifts(cx, cy, scale, cos, sin, closeUp) {

    const horizontal = x * cos - z * sin;
    const depth = x * sin + z * cos;

    const facing = depth / radius;
    const front = depth >= 0;
    const left = cx + horizontal * scale * perspective;
    const top = cy - (y - 1.41 - depth * 0.18) * scale * perspective;
    const size = Math.max(10, scale * .150 * perspective) * (1 + closeUp * .54);
    const tilt = 5 * Math.sin(index * 2.399) - horizontal * 8;
    button.tabIndex = front ? 0 : -1;
    button.style.pointerEvents = front ? "" : "none";
    button.style.zIndex = front ? 3 + Math.round(depth * 100) : 1;
    button.style.opacity = front ? .78 + .22 * facing : .18 + .58 * (1 + facing);
    button.style.setProperty("--gift-width", size.toFixed(2) + "px");
    button.style.transform = "translate(" + (left - size / 2).toFixed(2) + "px, " +
      top.toFixed(2) + "px) rotate(" + tilt.toFixed(2) + "deg) scaleX(" +
      (.64 + .36 * Math.abs(facing)).toFixed(2) + ")";
  }
}

function drawTree() {
  ctx.clearRect(0, 0, width, height);
  const scale = Math.min(height / 4.85, width / 3.1) * treeZoom;
  if (scale <= 0) return;
  // A close-up follows the ornaments at the base of the tree.
  const closeUp = Math.max(0, (treeZoom - 1) / (maxZoom - 1));
  const cx = width * 0.5;
  const cy = height * (.535 - closeUp * .28);
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const groundY = cy + scale * 1.71;
  const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, scale * 1.34);
  pool.addColorStop(0, "#cfab6533");
  pool.addColorStop(0.44, "#81c79c19");
  pool.addColorStop(1, "#81c79c00");
  ctx.save();
  ctx.translate(cx, groundY);
  ctx.scale(1, 0.163);
  ctx.fillStyle = pool;
  ctx.fillRect(-scale * 1.34, -scale * 1.34, scale * 2.68, scale * 2.68);
  ctx.restore();

  for (let i = 0; i < tree.length; i++) {
    const [x, y, z, kind, size, phase] = tree[i];
    const horizontal = x * cos - z * sin;
    const depth = x * sin + z * cos;
    const perspective = 5.6 / (5.6 - depth);
    const point = projected[i];
    point.x = cx + horizontal * scale * perspective;
    point.y = cy - (y - 1.41 - depth * 0.18) * scale * perspective;
    point.depth = depth;
    point.radius = size * scale / 130 * perspective * (kind >= 2 ? 1.35 : 1);
    point.kind = kind;
    const flicker = 0.5 + 0.5 * Math.sin(phase * 35 + elapsed * (1.4 + phase * 2.1));
    point.alpha = kind < 2 ? (0.48 + 0.4 * phase) * (0.79 + 0.19 * depth)
                           : (0.65 + 0.34 * flicker) * (0.86 + 0.13 * depth);
  }

  projected.sort((a, b) => a.depth - b.depth);
  for (const {x, y, radius, kind, alpha, depth} of projected) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(lights[kind], x - radius, y - radius, 2 * radius, 2 * radius);
    if (kind === 2 && radius > scale * 0.026 && depth > 0.04) {
      ctx.fillStyle = "#fff3c2";
      ctx.fillRect(x - 0.45, y - radius * 0.92, 0.9, radius * 1.84);
      ctx.fillRect(x - radius * 0.7, y - 0.45, radius * 1.4, 0.9);
    }
  }
  ctx.globalAlpha = 1;
  drawStar(cx, cy - (3.13 - 1.41) * scale, scale * 0.157);
  placeGifts(cx, cy, scale, cos, sin, closeUp);
}

function draw() {
  drawSnow();
  drawTree();
}

function animate(now) {
  frame = requestAnimationFrame(animate);
  if (previous && now - previous < 30) return;
  const delta = previous ? Math.min((now - previous) / 1000, 0.05) : 0;
  previous = now;
  if (!album.open) {
    elapsed += delta;
    if (pointer === null && !giftLayer.matches(":focus-within") &&
        !giftLayer.querySelector(".gift:hover")) angle += delta * 0.32;
    draw();
  }
}

function setPlaying(active) {
  playing = active;
  play.textContent = playing ? "暂停动画" : "播放动画";
  cancelAnimationFrame(frame);
  previous = 0;
  if (playing) frame = requestAnimationFrame(animate);
}

function resize() {
  [width, height] = fitCanvas(treeCanvas, ctx);
  [skyWidth, skyHeight] = fitCanvas(skyCanvas, sky);
  draw();
}

const minZoom = Number(zoomControl.min) / 100;
const maxZoom = Number(zoomControl.max) / 100;

function setZoom(value) {
  treeZoom = Math.max(minZoom, Math.min(maxZoom, value));
  const percent = Math.round(treeZoom * 100);
  zoomControl.value = percent;
  zoomValue.textContent = percent + "%";
  if (!playing || treeZoom === maxZoom) drawTree();
  if (treeZoom <= maxZoom - .16) albumArmed = true;
  if (treeZoom === maxZoom && albumArmed && memories.length && !album.open) {
    albumArmed = false;
    openMemory(selectedMemory);
  }
}

zoomControl.addEventListener("input", () => setZoom(Number(zoomControl.value) / 100));
play.addEventListener("click", () => setPlaying(!playing));
motion.addEventListener("change", (event) => setPlaying(!event.matches));
new ResizeObserver(resize).observe(treeCanvas);
treeCanvas.addEventListener("pointerdown", (event) => {
  if (!event.isPrimary || event.button !== 0) return;
  pointer = event.clientX;
  treeCanvas.setPointerCapture(event.pointerId);
});
treeCanvas.addEventListener("pointermove", (event) => {
  if (!event.isPrimary || pointer === null) return;
  angle += (event.clientX - pointer) * 0.012;
  pointer = event.clientX;
  if (!playing) drawTree();
});
treeCanvas.addEventListener("lostpointercapture", (event) => {
  if (event.isPrimary) pointer = null;
});
treeCanvas.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  event.preventDefault();
  angle += event.key === "ArrowRight" ? 0.16 : -0.16;
  if (!playing) drawTree();
});

resize();
setPlaying(playing);
</script>
<script type="module">
const cameraButton = document.querySelector("#camera");
const cameraStatus = document.querySelector("#camera-status");
const albumGestureHelp = document.querySelector("#album-gesture");
const onlineCard = document.querySelector("#online-card");
const preview = document.querySelector("#preview");
const video = document.querySelector("#camera-video");
const overlay = document.querySelector("#camera-overlay");
const overlayContext = overlay.getContext("2d");
const assets = new URL("./hand-tracking/", location.href);
let session = null;
let modelPromise = null;

function report(message) {
  if (cameraStatus.textContent !== message) cameraStatus.textContent = message;
}

function loadModel() {
  if (!modelPromise) {
    modelPromise = (async () => {
      const {FilesetResolver, HandLandmarker} = await import(new URL("vision_bundle.mjs", assets).href);
      const files = await FilesetResolver.forVisionTasks(new URL("wasm", assets).href);
      return HandLandmarker.createFromOptions(files, {
        baseOptions: {modelAssetPath: new URL("hand_landmarker.task", assets).href, delegate: "CPU"},
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.55
      });
    })().catch((error) => {
      modelPromise = null;
      throw error;
    });
  }
  return modelPromise;
}

function stopCamera(message = "") {
  if (session) {
    cancelAnimationFrame(session.frame);
    session.stream?.getTracks().forEach((track) => track.stop());
    session = null;
  }
  video.srcObject = null;
  preview.hidden = true;
  albumGestureHelp.hidden = true;
  cameraButton.textContent = "开启手势";
  report(message);
}

function drawFingertips(hand) {
  if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
  }
  const {width, height} = overlay;
  overlayContext.clearRect(0, 0, width, height);
  if (!hand) return;
  const tips = [hand[4], hand[8]];
  overlayContext.beginPath();
  overlayContext.moveTo(tips[0].x * width, tips[0].y * height);
  overlayContext.lineTo(tips[1].x * width, tips[1].y * height);
  overlayContext.lineWidth = width * 0.014;
  overlayContext.strokeStyle = "#ffdb92";
  overlayContext.stroke();
  overlayContext.fillStyle = "#fff1bd";
  for (const {x, y} of tips) {
    overlayContext.beginPath();
    overlayContext.arc(x * width, y * height, width * 0.017, 0, Math.PI * 2);
    overlayContext.fill();
  }
}

function trackZoom(current, hand, now) {
  const aspect = video.videoWidth / video.videoHeight;
  const distance = (a, b) => Math.hypot((hand[a].x - hand[b].x) * aspect, hand[a].y - hand[b].y);
  // Use the palm as a reference so moving toward the camera has less effect.
  const palm = (distance(0, 9) + distance(5, 17)) / 2;
  if (palm < 0.038) {
    current.maxSince = null;
    report("请把整只手移近镜头。");
    return;
  }
  const opening = distance(4, 8) / palm;
  const fraction = Math.max(0, Math.min(1, (opening - 0.10) / 0.99));
  const atLimit = fraction >= .99;
  current.maxSince = atLimit ? (current.maxSince ?? now) : null;
  report("已识别手势");
  if (atLimit && (treeZoom === maxZoom || (now - current.maxSince >= 330 && treeZoom >= maxZoom - .05))) {
    if (treeZoom !== maxZoom) setZoom(maxZoom);
    return;
  }
  const target = Math.min(maxZoom - .012, minZoom + fraction * (maxZoom - minZoom));
  const delta = target - treeZoom;
  if (Math.abs(delta) > 0.002) setZoom(treeZoom + delta * 0.27);
}

function trackAlbumGesture(current, hand, now) {
  const state = current.swipe ??= {samples: [], last: null, quietSince: now, lastTurn: now, direction: 0};
  const sampleWindow = 1450;
  if (!hand) {
    // The detector can briefly lose the hand in the middle of a fast swipe.
    if (state.last && now - state.last.time > sampleWindow) {
      state.samples.length = 0;
      state.last = null;
    }
    return;
  }
  // Track the palm rather than the fingertips. The preview mirrors the camera.
  const joints = [0, 5, 9, 13, 17];
  const x = 1 - joints.reduce((total, i) => total + hand[i].x, 0) / joints.length;
  const y = joints.reduce((total, i) => total + hand[i].y, 0) / joints.length;
  const point = {x, y, time: now};
  if (!state.last || Math.hypot(x - state.last.x, y - state.last.y) > .023) state.quietSince = now;
  state.last = point;

  if (state.direction && now - state.quietSince >= 220 && now - state.lastTurn >= 350) {
    state.direction = 0;
    state.samples.length = 0;
  }
  state.samples = state.samples.filter((sample) => now - sample.time <= sampleWindow);
  let travel = 0;
  for (const sample of state.samples) {
    const dx = x - sample.x;
    const dy = y - sample.y;
    if (Math.abs(dx) > Math.abs(travel) && Math.abs(dx) > 1.65 * Math.abs(dy)) travel = dx;
  }
  state.samples.push(point);
  const direction = travel < 0 ? 1 : -1;
  if (Math.abs(travel) >= .13 && direction !== state.direction && now - state.lastTurn >= 360) {
    stepMemory(direction);
    state.direction = direction;
    state.lastTurn = now;
    state.samples = [point];
  }
}

function trackFrame(current, model, now) {
  if (session !== current) return;
  if (now - current.lastSample >= 66 && video.readyState >= 2 && video.currentTime !== current.lastVideoTime) {
    current.lastSample = now;
    current.lastVideoTime = video.currentTime;
    try {
      const hand = model.detectForVideo(video, now).landmarks[0];
      if (album.open) {
        current.maxSince = null;
        trackAlbumGesture(current, hand, now);
      } else {
        current.swipe = null;
        drawFingertips(hand);
        if (hand) trackZoom(current, hand, now);
        else {
          current.maxSince = null;
          report("请将一只手放入画面。");
        }
      }
    } catch (error) {
      console.error(error);
      stopCamera("手势识别中断，可以重试或用滑杆缩放。");
      return;
    }
  }
  current.frame = requestAnimationFrame((time) => trackFrame(current, model, time));
}

async function startCamera() {
  if (location.protocol === "file:") {
    onlineCard.hidden = false;
    return;
  }
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    report("请用支持摄像头的浏览器打开 HTTPS 页面。");
    return;
  }
  const current = {stream: null, frame: 0, lastSample: 0, lastVideoTime: -1, maxSince: null, swipe: null};
  session = current;
  cameraButton.textContent = "关闭手势";
  report("等待摄像头权限…");
  let modelStage = false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {width: {ideal: 480}, height: {ideal: 360}, frameRate: {ideal: 24, max: 30}},
      audio: false
    });
    if (session !== current) {
      stream.getTracks().forEach((track) => track.stop());
      return;
    }
    current.stream = stream;
    stream.getVideoTracks()[0].addEventListener("ended", () => {
      if (session === current) stopCamera("摄像头已断开，可以重新开启手势。");
    });
    video.srcObject = stream;
    await video.play();
    if (session !== current) return;
    overlayContext.clearRect(0, 0, overlay.width, overlay.height);
    preview.hidden = false;
    modelStage = true;
    report("正在加载手部识别模型…");
    const model = await loadModel();
    if (session !== current) return;
    albumGestureHelp.hidden = false;
    report("请将一只手放入画面。");
    current.frame = requestAnimationFrame((time) => trackFrame(current, model, time));
  } catch (error) {
    if (session !== current) return;
    console.error(error);
    if (modelStage) stopCamera("手势模型加载失败，可以重试或用滑杆缩放。");
    else if (error.name === "NotAllowedError") stopCamera("请在浏览器地址栏允许使用摄像头，再试一次。");
    else if (error.name === "NotFoundError") stopCamera("未找到摄像头，可以用滑杆缩放。");
    else stopCamera("摄像头无法开启，请确认它可用后重试。");
  }
}

cameraButton.addEventListener("click", () => {
  if (session) stopCamera("摄像头已关闭");
  else startCamera();
});
window.addEventListener("pagehide", () => stopCamera());
</script>
